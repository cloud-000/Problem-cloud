<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="text-scale" content="scale" />
        <meta name="theme-color" content="#f8fafc" />
        <title>ProblemCloud</title>
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("theme");
                    if (!theme) {
                        var ua = navigator.userAgent || "";
                        if (
                            /kindle|silk|kftt|kfot|kfjwa|kfjwi|kfsowi|kfthwi|kfapwi|kobo|nook|paperwhite|eink|boox|onyx|remarkable/i.test(
                                ua,
                            )
                        ) {
                            theme = "kindle";
                        }
                    }
                    if (theme) {
                        document.documentElement.setAttribute("data-theme", theme);
                    }
                    var style = localStorage.getItem("theme:style");
                    if (style && theme && theme !== "light") {
                        document.documentElement.style.cssText = style;
                    } else if (theme && theme !== "light") {
                        var css = document.createElement("style");
                        css.id = "theme-preload-fallback";
                        css.textContent = "*, *::before, *::after { transition: none !important; }";
                        document.head.appendChild(css);
                    }
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta && theme) {
                        if (theme === "dark") meta.setAttribute("content", "#0b0f19");
                        else if (theme === "kindle") meta.setAttribute("content", "#ffffff");
                        else meta.setAttribute("content", "#f8fafc");
                    }

                    var sidebarExpanded = localStorage.getItem("layout:sidebar-expanded");
                    if (sidebarExpanded === "false") {
                        document.documentElement.setAttribute("data-sidebar-expanded", "false");
                    }
                    var sidebarWidth = localStorage.getItem("layout:sidebar-width");
                    if (sidebarWidth) {
                        try {
                            var parsedWidth = JSON.parse(sidebarWidth);
                            if (parsedWidth && typeof parsedWidth.width === "number") {
                                document.documentElement.style.setProperty(
                                    "--sidebar-initial-width",
                                    parsedWidth.width + "px",
                                );
                                document.documentElement.setAttribute(
                                    "data-sidebar-width",
                                    String(parsedWidth.width),
                                );
                            }
                        } catch (_) {}
                    }
                } catch (_) {}
            })();
        </script>
        <style id="sidebar-preload">
            @media (min-width: 768px) {
                html[data-sidebar-expanded="false"] [data-slot="sidebar-root"] {
                    width: 4rem !important;
                    transition: none !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-header"] > a {
                    display: none !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-header"] {
                    justify-content: center !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-group"] [data-slot="sidebar-item"] > a {
                    justify-content: center !important;
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                    width: 2.5rem !important;
                    height: 2.5rem !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-group"] [data-slot="sidebar-item"] span.truncate {
                    display: none !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-group"] [data-slot="sidebar-item"] button > span:nth-of-type(2) {
                    display: none !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-footer"] button {
                    justify-content: center !important;
                }
                html[data-sidebar-expanded="false"] [data-slot="sidebar-footer"] button > span.min-w-0,
                html[data-sidebar-expanded="false"] [data-slot="sidebar-footer"] button > span.material-symbols-rounded:last-child {
                    display: none !important;
                }
                html[data-sidebar-width]:not([data-sidebar-expanded="false"]) [data-slot="sidebar-root"]:not([data-ready="true"]) {
                    width: var(--sidebar-initial-width) !important;
                    transition: none !important;
                }
            }
            [data-slot="sidebar-root"]:not([data-ready="true"]),
            [data-slot="sidebar-root"]:not([data-ready="true"]) * {
                transition: none !important;
            }
        </style>
        <!-- Every rendering asset below is same-origin on purpose. A downloaded
             problem has to render with no network (docs/offline.md §4), and the
             service worker can only precache same-origin build/static files, so
             KaTeX and the fonts are vendored into `static/` by
             `bun scripts/vendor-assets.ts`. Do not reintroduce a CDN link here. -->
        <!--KaTeX-->
        <!-- Load the stylesheet without blocking first paint: preload as a
             non-render-blocking resource, then promote it to a stylesheet once
             it arrives. The home route renders no math above the fold, so a
             brief async load is fine; <noscript> keeps math styled without JS. -->
        <link
            rel="preload"
            as="style"
            href="/vendor/katex/katex.min.css"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
        </noscript>
        <script defer src="/vendor/katex/katex.min.js"></script>
        <script defer src="/vendor/katex/auto-render.min.js"></script>
        <!--Fonts (vendored; see scripts/vendor-assets.ts and scripts/icon-subset.ts)-->
        <link
            rel="preload"
            href="/fonts/inter-400-normal-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/inter-600-normal-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/source-serif-4-200-900-normal-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="/fonts/text.css" />
        <link rel="stylesheet" href="/fonts/material-symbols-rounded.css" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- iOS Home Screen Support -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="ProblemCloud" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- Web App Manifest & Theme -->
        <link rel="manifest" href="/manifest.webmanifest" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
