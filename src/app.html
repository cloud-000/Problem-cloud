<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="text-scale" content="scale" />
        <!--KaTeX-->
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <!-- Load the stylesheet without blocking first paint: preload as a
             non-render-blocking resource, then promote it to a stylesheet once
             it arrives. The home route renders no math above the fold, so a
             brief async load is fine; <noscript> keeps math styled without JS. -->
        <link
            rel="preload"
            as="style"
            href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css"
            integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB"
            crossorigin="anonymous"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css"
                integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB"
                crossorigin="anonymous"
            />
        </noscript>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"
            integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs"
            crossorigin="anonymous"
        ></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js"
            integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
            crossorigin="anonymous"
        ></script>
        <!--Google Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;icon_names=2d,abc,account_circle,add,add_comment,admin_panel_settings,ads_click,analytics,apps,architecture,archive,arrow_back,arrow_forward,arrow_selector_tool,arrow_upward,assignment_turned_in,assistant,auto_awesome,bar_chart,block,bolt,book_5,bookmark,brush,bug_report,calculate,calendar_month,campaign,cancel,casino,category_search,center_focus_strong,center_focus_weak,change_history,chat,chat_bubble,check,check_circle,checklist,chevron_left,chevron_right,circle,class,clear,close,cloud,code,commit,construction,content_copy,conversation,countertops,create,cycle,dark_mode,data_object,data_usage,database,delete,delete_sweep,description,details,distance,done,done_all,download,drag_indicator,draw,edit,email,equal,error,error_outline,event_upcoming,expand_less,expand_more,explicit,favorite,feedback,fiber_manual_record,filter_alt_off,filter_none,fit_screen,flag,folder_open,format_bold,format_italic,format_underlined,forum,forward,function,functions,grid_view,group,groups,help,history,history_toggle_off,home,hourglass_empty,html,http,https,image,inbox,info,ink_eraser,input,insights,invert_colors,join,key,keyboard_arrow_down,keyboard_arrow_up,label,labs,last_page,launch,layers,leaderboard,light,light_mode,lightbulb,linear_scale,link,link_off,list,login,logout,looks_3,map,mark_email_unread,menu,message,military_tech,mobile,mode,more,more_horiz,more_vert,mouse,move,mystery,notes,notifications,opacity,open_in_full,open_in_new,overview,palette,pan_tool,password,pause,pending,person,person_off,picture_as_pdf,picture_in_picture,pill,pinch,play_arrow,play_circle,preview,problem,progress_activity,public,push_pin,query_stats,question_mark,quiz,radio,rectangle,redo,refresh,remove,replay,report,resize,restart_alt,restore,route,rule,save,scale,scene,schedule,schema,search,security,segment,select,send,settings,settings_backup_restore,shapes,share,shi             rel="stylesheet"
